{% comment %} templates/login.html {% endcomment %}

{% extends "base_generic.html" %}

{% block content %}
  <h2>Login</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
    <input type="hidden" name="next" value="{{ request.GET.next }}">
  </form>
{% endblock %}
