{% extends "base.html" %}
{% load static %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/folder_list.css' %}">
{% endblock %}

{% block content %}
<div class="folder-container">
  <div class="glass-card">
    <div class="header">
      <h1>📂 Your Folders</h1>
      <a href="{% url 'storage:create_folder' %}" class="btn btn-primary">
        <i class="fas fa-folder-plus"></i>
        New Folder
      </a>
    </div>

    {% if folders %}
    <div class="folder-grid">
      {% for folder in folders %}
      <div class="folder-item">
        <a href="{% url 'storage:folder_detail' folder_id=folder.id %}" class="folder-link">
          <i class="fas fa-folder"></i>
          <span class="folder-name">{{ folder.name }}</span>
        </a>
      </div>
      {% endfor %}
    </div>
    {% else %}
    <div class="empty-state">
      <i class="fas fa-folder-open"></i>
      <p>No folders found. <a href="{% url 'storage:create_folder' %}">Create your first folder</a></p>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
