{% extends "base.html" %}

<!-- storage/templates/upload_file.html -->

{% block content %}
  <h1>Upload a File</h1>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload</button>
  </form>
  <a href="{% url 'storage:file_list' %}">Back to File List</a>
{% endblock %}
